name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    name: Check, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Svelte check
        run: bun run check
      - name: ESLint
        run: bunx eslint src/ tests/ scripts/ e2e/
      - name: Test
        run: bun run test
